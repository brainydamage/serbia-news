name: build

on:
  schedule:
    # каждые 20 минут, но не ровно в :00/:20/:40 — на эти минуты у GitHub пик, запуски откладываются и теряются
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # прошлые данные нужны, чтобы при сбое ленты показать её последние новости,
      # кэш переводов — чтобы не платить за перевод одних и тех же новостей,
      # архив — все новости за последние дни для ежедневной сводки
      - name: Restore previous data
        uses: actions/cache/restore@v4
        with:
          path: |
            site/data.json
            cache/translations.json
            cache/archive.json
          key: data-${{ github.run_id }}
          restore-keys: data-

      - run: python build.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # жалобы на перевод (worker/): адрес — переменная репозитория, пароль — секрет
          REPORTS_URL: ${{ vars.REPORTS_URL }}
          REPORTS_TOKEN: ${{ secrets.REPORTS_TOKEN }}

      - name: Save data
        uses: actions/cache/save@v4
        with:
          path: |
            site/data.json
            cache/translations.json
            cache/archive.json
          key: data-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # IndexNow: сообщаем Bing и Яндексу, что страницы обновились. Ключ публичный по устройству протокола —
      # он лежит в static/<ключ>.txt. При пуше — всегда; остальные запуски (расписание GitHub и cron-job.org,
      # который дёргает workflow_dispatch каждые 20 минут) — раз в 6 часов, чтобы не выглядеть спамом
      - name: Ping IndexNow
        run: |
          hour=$(( 10#$(date -u +%H) )); minute=$(( 10#$(date -u +%M) ))
          if [ "${{ github.event_name }}" != "push" ] && { [ $((hour % 6)) -ne 0 ] || [ $minute -ge 20 ]; }; then
            echo "пропуск: вне пуша пингуем раз в 6 часов"; exit 0
          fi
          curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"vestomat.rs","key":"d3b6a840f51628e8e129112b16884cfe","keyLocation":"https://vestomat.rs/d3b6a840f51628e8e129112b16884cfe.txt","urlList":["https://vestomat.rs/","https://vestomat.rs/ru/"]}' || true
