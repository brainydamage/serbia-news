name: build

# по расписанию сборку запускает cron-job.org через workflow_dispatch каждые 15 минут: расписание самого GitHub
# (schedule) у этого репозитория почти не срабатывало, а когда срабатывало — давало лишнюю сборку
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# идущую сборку не отменяем: она уже заплатила за перевод, а отменённая не сохранит кэш и не отправит расходы
# в статистику. Новая ждёт в очереди; GitHub держит в ней одну сборку и заменяет её более свежей
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements.txt

      - run: pip install -r requirements-stories.txt
        continue-on-error: true

      # модель векторов для сюжетов (stories.py, ~2 ГБ): ключ постоянный — скачивается с Hugging Face один раз
      - name: Embedding model
        uses: actions/cache@v4
        with:
          path: cache/fastembed
          key: fastembed-multilingual-e5-large

      # прошлые данные нужны, чтобы при сбое ленты показать её последние новости,
      # кэш переводов — чтобы не платить за перевод одних и тех же новостей,
      # архив — все новости за последние дни для ежедневной сводки
      - name: Restore previous data
        uses: actions/cache/restore@v4
        with:
          path: |
            site/data.json
            cache/translations.json
            cache/archive.json
          key: data-${{ github.run_id }}
          restore-keys: data-

      # сюжеты (stories_live.py) — отдельным кэшем: версия кэша зависит от списка путей, и добавленный в «data» путь
      # оставил сборку без старого кэша — без переводов и архива
      - name: Restore stories
        uses: actions/cache/restore@v4
        with:
          path: |
            cache/stories.json
            cache/story-vectors.npz
          key: stories-${{ github.run_id }}
          restore-keys: stories-

      - run: python build.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # жалобы на перевод (worker/): адрес — переменная репозитория, пароль — секрет
          REPORTS_URL: ${{ vars.REPORTS_URL }}
          REPORTS_TOKEN: ${{ secrets.REPORTS_TOKEN }}
          FASTEMBED_CACHE_PATH: cache/fastembed

      - name: Save data
        uses: actions/cache/save@v4
        with:
          path: |
            site/data.json
            cache/translations.json
            cache/archive.json
          key: data-${{ github.run_id }}

      - name: Save stories
        if: hashFiles('cache/stories.json') != ''  # сюжеты пропущены — сохранять нечего, а пустой путь роняет шаг
        uses: actions/cache/save@v4
        with:
          path: |
            cache/stories.json
            cache/story-vectors.npz
          key: stories-${{ github.run_id }}

      # из кэша Actions архив не скачать, а он нужен локально для экспериментов (сюжеты): снимок сохраняет snapshot.py.
      # В архиве все последние дни (ARCHIVE_DAYS в build.py), поэтому хватает свежего снимка, старые не держим
      - uses: actions/upload-artifact@v7
        with:
          name: archive
          path: cache/archive.json
          retention-days: 1

      # состояние сюжетов — для разбора решений раскладки и склейки локально (gh run download --name stories)
      - uses: actions/upload-artifact@v7
        if: hashFiles('cache/stories.json') != ''
        with:
          name: stories
          path: cache/stories.json
          retention-days: 1

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # бывает, что деплой сразу после загрузки не видит архив («No artifacts named github-pages») — у GitHub
      # он появляется не мгновенно. Тогда ждём и пробуем ещё раз, а не роняем сборку
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # IndexNow: сообщаем Bing и Яндексу, что страницы обновились. Ключ публичный по устройству протокола —
      # он лежит в static/<ключ>.txt. При пуше — всегда; запуски от cron-job.org (каждые 15 минут) — раз в 6 часов,
      # чтобы не выглядеть спамом
      - name: Ping IndexNow
        run: |
          hour=$(( 10#$(date -u +%H) )); minute=$(( 10#$(date -u +%M) ))
          if [ "${{ github.event_name }}" != "push" ] && { [ $((hour % 6)) -ne 0 ] || [ $minute -ge 15 ]; }; then
            echo "пропуск: вне пуша пингуем раз в 6 часов"; exit 0
          fi
          curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"vestomat.rs","key":"d3b6a840f51628e8e129112b16884cfe","keyLocation":"https://vestomat.rs/d3b6a840f51628e8e129112b16884cfe.txt","urlList":["https://vestomat.rs/","https://vestomat.rs/ru/"]}' || true
