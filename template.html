<!doctype html>
<html lang="__HTML_LANG__">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: на iPhone страница доходит до краёв, а отступы от выреза и полоски «домой» — через env(safe-area-inset-*) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--__HEAD__-->
<!-- favicon.ico — для браузеров, которые не понимают SVG (иначе рисуют букву-заглушку); остальные берут SVG -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- приложение «На экран Домой»: без адресной строки, страницу держит в кеше /sw.js -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Vestomat">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#282c35" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap">
<style>
/* оформление по мотивам infomate.club/news: шрифт Nunito, белый фон, колонки без карточек */
:root {
  --bg: #ffffff;
  --text: #333333;
  --strong: #000000;
  --muted: #8a8a8a;
  --faint: #a8a8a8;
  --line: #333333;
  --soft: #ececec;
  --read: #afafaf;
  --hover: #9b9b9b;
  --tip-bg: #282c35;
  --tip-text: #dddddd;
  --c-independent: #1d4ed8;
  --c-investigations: #8ec7c3;
  --c-progov: #dc2626;
  --c-state: #c084fc;
  --c-mainstream: #71827a;
  --c-economy: #9e8f55;
  --c-foreign-sr: #e6b690;
  --c-foreign: #ef7f16;
  --c-reddit: #8a423a;
  --c-trends: #3087b3;
  --c-regional: #38d64e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #282c35;
    --text: #dddddd;
    --strong: #ffffff;
    --muted: #9a9ca3;
    --faint: #7c7f87;
    --line: #dddddd;
    --soft: #383d49;
    --read: #737373;
    --hover: #9b9b9b;
    --tip-bg: #3a404d;
    --tip-text: #eeeeee;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
/* сколько сверху занимает система. В приложении на iPhone (iOS 26) размыта не только строка состояния, но и полоса
   около 25pt под ней — на её высоту опускаем страницу, шапку и плашку о свежих новостях */
:root { --safe-top: env(safe-area-inset-top); }
@supports (-webkit-touch-callout: none) {
  @media (display-mode: standalone) { :root { --safe-top: calc(env(safe-area-inset-top) + 28px); } }
}
body {
  margin: 0;
  /* приложение на iPhone рисует страницу и под строкой состояния (iOS размывает всё, что под ней): сверху отступ
     ниже размытия; боком — вырез слева или справа. В браузере эти отступы нулевые */
  padding: var(--safe-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  background: var(--bg);
  color: var(--text);
  font: 16px/1.3 "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
a { color: inherit; }
button, input { font: inherit; color: inherit; }

/* ---------- header ---------- */
header {
  position: sticky; top: var(--safe-top); z-index: 5;
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter: blur(10px);
}
.bar {
  max-width: 1300px; margin: 0 auto; padding: 14px 20px;
  display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center;
}
/* кнопки везде на одних и тех же местах: у каждой ширина по самой длинной подписи (во всех языках и алфавитах),
   группа прижата вправо. «Обновлено…» — под названием: рядом с ним оно не помещалось и сталкивало кнопки вниз.
   Ширина названия одна на оба языка (влезает «Сербия: новости»), поэтому кнопки уходят на вторую строку
   при одной и той же ширине окна на всех страницах */
.brand { display: flex; flex-direction: column; align-items: flex-start; flex: 1 1 0; min-width: 280px; }
.brand h1 { margin: 0; font-size: 29px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
.brand .logo { width: 28px; height: 28px; vertical-align: -4px; margin-right: 10px; }
.updated { color: var(--muted); font-size: 13px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.updated b { font-weight: 800; }  /* название сайта: заголовок описательный, а запомнить надо имя */
/* вышла новая сборка, а страница открыта давно: плашка сверху и ссылка рядом с «обновлено» */
.refresh {
  position: fixed; top: calc(12px + var(--safe-top)); left: 50%; transform: translateX(-50%); z-index: 20;
  border: 0; border-radius: 999px; padding: 9px 18px; cursor: pointer; white-space: nowrap;
  background: var(--tip-bg); color: var(--tip-text); font: inherit; font-size: 14px; font-weight: 700;
  box-shadow: 0 4px 16px rgb(0 0 0 / .25);
}
.refresh-link { border: 0; background: none; padding: 0; color: var(--text); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
.topline { max-width: 1300px; margin: 0 auto; padding: 8px 20px 0; color: var(--muted); font-size: 13px; text-align: right; }
.topline:empty { display: none; }
#info > span { white-space: nowrap; }
#lang .short { display: none; }
#info .dot { width: 7px; height: 7px; margin-left: 5px; vertical-align: 1px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.controls-row { display: contents; }
.seg { display: inline-flex; background: var(--soft); border-radius: 20px; padding: 3px; }
.seg button {
  border: 0; background: none; padding: 5px 12px; border-radius: 20px; cursor: pointer;
  font-size: 14px; font-weight: 700; color: var(--muted);
}
.seg button:hover { color: var(--text); }
/* ширины по самой длинной подписи: «Оригинал», «Русский», «Све вести» */
#script [data-v="orig"] { width: 92px; }
#script [data-v="lat"] { width: 50px; }
#script [data-v="cyr"] { width: 54px; }
#lang button { width: 80px; }
#view button { width: 84px; padding-left: 4px; padding-right: 4px; }
.seg button[aria-pressed="true"] { background: var(--tip-bg); color: var(--tip-text); }
.search {
  border: 1.5px solid var(--soft); background: var(--bg); color: var(--text);
  border-radius: 20px; padding: 6px 14px; font-size: 14px; width: 180px;
}
.search:focus { outline: none; border-color: var(--text); }
/* свой крестик вместо встроенного: у Firefox его нет, а у Chrome и Safari он у каждого свой */
.search-box { position: relative; display: inline-flex; }
.search { padding-right: 34px; }
.search::-webkit-search-cancel-button { -webkit-appearance: none; }
.search-clear {
  position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
  width: 20px; height: 20px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
  background: var(--soft); color: var(--muted); font-size: 15px; line-height: 20px;
}
.search-clear:hover { background: var(--tip-bg); color: var(--tip-text); }

/* ряд разделов под шапкой: в «По медиям» — оглавление, в «Все вести» — фильтр. Свой sticky, чтобы на телефоне
   оставался на экране, даже когда шапка с кнопками уезжает вверх */
.chips {
  position: sticky; top: calc(var(--header-h, 0px) + var(--safe-top)); z-index: 4;
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter: blur(10px);
  padding: 0 max(20px, calc((100% - 1260px) / 2)) 12px;
  display: flex; flex-wrap: wrap; gap: 6px;
}
.chip {
  border: 1.5px solid var(--soft); background: var(--bg); border-radius: 20px;
  padding: 3px 12px 3px 9px; font-size: 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"], .chip.jump[aria-current="true"] { background: var(--tip-bg); color: var(--tip-text); border-color: var(--tip-bg); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }

main { max-width: 1300px; margin: 0 auto; padding: 0 0 40px; }

/* ---------- sources view ---------- */
.section { margin-top: 50px; scroll-margin-top: calc(var(--sticky-h, 0px) + 10px); }
.section-head { text-align: center; margin: 0 20px; padding-bottom: 12px; border-bottom: 1.5px solid var(--line); }
.section-head h2 { margin: 0; font-size: 28.8px; font-weight: 700; }
.section-head .dot { width: 10px; height: 10px; vertical-align: middle; margin: -4px 12px 0 0; }
.section-head p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); }

.camps { scroll-margin-top: calc(var(--sticky-h, 0px) + 10px); margin: 30px 20px 0; padding: 18px 20px 6px; border: 1.5px solid var(--line); border-radius: 10px; }
.camps-dot { background: conic-gradient(var(--c-independent) 0 25%, var(--c-state) 0 50%, var(--c-mainstream) 0 75%, var(--c-progov) 0); }
.camps h2 { margin: 0 0 14px; font-size: 20px; }
/* широкий экран: колонка на лагерь (--col, --row ставит renderCamps); уже — один перемешанный список кругами */
.camps-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 28px; margin-bottom: 10px; }
.camps-grid > li { grid-column: var(--col); grid-row: var(--row); }
.camps-legend { display: none; margin: -6px 0 14px; color: var(--muted); font-size: 12px; }
.camps-legend > span { display: inline-flex; align-items: center; gap: 5px; margin-right: 12px; white-space: nowrap; }
.camp-name { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 8px; }
.camp-name .dot { width: 8px; height: 8px; margin: -2px 7px 0 0; vertical-align: middle; }
/* две колонки не годятся: слева всегда были бы лагеря 1 и 3, справа 2 и 4 — как будто пары */
@media (max-width: 1100px) {
  .camps-grid { grid-template-columns: 1fr; }
  .camps-grid > li { grid-column: auto; grid-row: auto; }
  .camps-grid > .camp-name { display: none; }
  .camps-legend { display: block; }
}
@media (max-width: 640px) {
  .camps-grid > [data-round="3"] { display: none; }  /* на телефоне два круга — блок не длиннее экрана */
}

.card { padding: 35px 20px 0; min-width: 0; }
.card-head { display: flex; gap: 12px; align-items: center; margin-bottom: 15px; }
.avatar {
  position: relative; width: 32px; height: 32px; border-radius: 6px; flex: none; overflow: hidden;
  display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 16px;
}
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
/* свои иконки — квадраты во всю площадь (icons.py): цвет раздела под ними просвечивал бы ободком по скруглённому краю */
/* буква — запасная, на случай если картинка не загрузится; у прозрачных (Sputnik, герб Владе) она видна сквозь иконку */
.avatar:has(img) { background: none !important; color: transparent; }
.avatar:has(.region-map) { background: none !important; overflow: visible; height: 40px; }
.region-map { width: 100%; height: 100%; }
.region-map .country { fill: var(--muted); fill-opacity: .3; }
.region-map .region { fill: var(--c-regional); }
.card-name { text-decoration: none; font-weight: 700; font-size: 20.8px; line-height: 1.2; }
a.card-name:hover { color: var(--hover); }
.card-meta { color: var(--muted); font-size: 11.2px; margin-top: 2px; }
.card-meta .warn { color: #d97706; }
.card-meta a { color: inherit; text-decoration: none; }
.card-meta a:hover { color: var(--hover); }

.items { list-style: none; margin: 0; padding: 0; }
.row { display: flex; gap: 10px; margin-bottom: 8px; }
.time { flex: none; width: 42px; white-space: nowrap; color: var(--faint); font-size: 12px; padding-top: 2px; font-variant-numeric: tabular-nums; }
.head {
  flex: 1; min-width: 0; text-decoration: none; cursor: pointer; font-size: 16px; line-height: 1.3;
  overflow-wrap: anywhere; -webkit-user-drag: none;  /* тянуть мышью — выделять текст, а не перетаскивать ссылку */
}
.head:hover { color: var(--hover); }
.head.fresh { font-weight: 700; color: var(--strong); --hc: var(--strong); }
.item.read .head { color: var(--read); font-weight: 400; --hc: var(--read); }
.via { color: var(--muted); font-size: 13px; margin-left: 4px; }
.traffic { color: var(--faint); font-size: 13px; margin-left: 4px; white-space: nowrap; }
.card .items { margin-bottom: 8px; }

/* Раскрытая по нажатию новость целиком (время, заголовок, подводка) — тёмная плашка до внутренних краёв контейнера.
   Всё зависит от --p (0 — закрыта, 1 — раскрыта): его по кадрам ведёт animateDetails, так фон, цвета, отступы и высота
   идут в такт друг с другом и с прокруткой. Отступы — полями содержимого, а flow-root не выпускает их за фон;
   при --p: 0 раскладка та же, что у закрытой */
.item { --edge: 12px; }
.card .item, .feed .item, .themes .item { --edge: 20px; }
.camps .item { --edge: 14px; }
.item.open {
  display: flow-root; margin: 0 calc(-1 * var(--edge)) calc(var(--p) * 12px); padding: 0 var(--edge);
  background: color-mix(in srgb, var(--tip-bg) calc(var(--p) * 100%), transparent); color: var(--tip-text);
}
.item.open .row { margin-top: calc(var(--p) * 14px); }
.item.open .head { color: color-mix(in srgb, color-mix(in srgb, var(--tip-text) 80%, var(--tip-bg)) calc(var(--p) * 100%), var(--hc, var(--text))); }
.item.open .time { color: color-mix(in srgb, color-mix(in srgb, var(--tip-text) 55%, var(--tip-bg)) calc(var(--p) * 100%), var(--faint)); }
.details { height: 0; overflow: hidden; margin: calc(var(--p) * 2px) 0 0 52px; font-size: 16px; line-height: 1.45; }
.details-text { opacity: var(--p); }
.details p { margin: 0; }
.details p + p { margin-top: 10px; }
.details .orig { font-size: 13px; opacity: .65; }
/* суть одной фразой (Haiku по тексту статьи, worker /essence): пока пишется — бледные полоски на её месте,
   примерно той же высоты, чтобы пришедшая фраза почти не сдвигала остальное */
.essence { font-weight: 500; animation: essence-in .3s ease-out; }
.essence.loading { animation: none; }
.essence.loading .bar { display: block; height: .75em; margin: .35em 0; border-radius: 4px; background: currentColor;
  animation: essence-wait 1.1s ease-in-out infinite alternate; }
.essence.loading .bar:last-child { width: 55%; }
@keyframes essence-wait { from { opacity: .07; } to { opacity: .18; } }
@keyframes essence-in { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .essence, .essence.loading .bar { animation: none; opacity: 1; } .essence.loading .bar { opacity: .12; } }

/* жалоба на перевод: на компьютере флажок в конце строки при наведении, на телефоне — ссылка в подводке */
.report-flag {
  flex: none; align-self: flex-start; border: 0; background: none; padding: 0 2px; cursor: pointer;
  color: var(--faint); font: inherit; font-size: 13px; line-height: 1.6; opacity: 0;
}
.row:hover .report-flag, .report-flag:focus-visible { opacity: 1; }
.report-flag:hover { color: var(--text); }
@media (hover: none) { .report-flag { display: none; } }
/* под текстом плашки: жалобы («Плохой перевод?», «Плохая суть?») в одну строку */
.flags { display: flex; flex-wrap: wrap; column-gap: 18px; }
.flags:empty { display: none; }
/* какую подводку показывать: суть от ИИ, подводку издания или обе (с подписями) — переключатель в самой плашке,
   где видно, что он меняет; запоминается для всего сайта */
.leads-mode { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; font-size: 13px; }
.leads-mode > span { opacity: .65; margin-right: 2px; }
.leads-mode button {
  border: 0; padding: 4px 11px; border-radius: 999px; cursor: pointer; font: inherit; color: inherit;
  background: color-mix(in srgb, var(--tip-text) 12%, transparent);
}
.leads-mode button[aria-pressed="true"] { background: var(--tip-text); color: var(--tip-bg); font-weight: 700; }
/* «обе»: над каждой подводкой — откуда она */
.details [data-label]::before { content: attr(data-label); display: block; margin-bottom: 2px; font-size: 12px; font-weight: 400; opacity: .6; }
.flag-link {
  display: block; margin-top: 10px; border: 0; background: none; padding: 0; cursor: pointer;
  color: inherit; opacity: .65; font: inherit; font-size: 13px; text-decoration: underline;
}
/* «Читать на …» и ✕ — обе справа; ✕ — вытянутая, как сама кнопка «Читать», и через зазор: вплотную палец, сворачивая, попадал в «Читать» (отзыв 25.11).
   Нажимается ✕ и чуть мимо — ::before на 8px шире кнопки со всех сторон */
.details-actions { display: flex; justify-content: flex-end; align-items: center; gap: 24px; margin: 12px 0 18px; }
.details-close {
  position: relative; flex: none; margin: 0; width: 140px; align-self: stretch; border: 0; border-radius: 999px; cursor: pointer;
  background: color-mix(in srgb, var(--tip-text) 14%, transparent); color: inherit; font-size: 17px; line-height: 1;
}
.details-close::before { content: ""; position: absolute; inset: -8px; }
.read-link {
  min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  padding: 10px 14px; border-radius: 999px; background: var(--tip-text); color: var(--tip-bg);
  font-size: 14px; font-weight: 700; text-decoration: none;
}
dialog.report {
  border: 0; border-radius: 20px; padding: 20px 22px; width: min(460px, calc(100% - 32px));
  background: var(--bg); color: var(--text); font: inherit; box-shadow: 0 12px 40px rgb(0 0 0 / .25);
}
dialog.report::backdrop { background: rgb(0 0 0 / .35); }
.report h2 { margin: 0 0 12px; font-size: 20px; }
.report .orig { margin: 0 0 4px; color: var(--muted); font-size: 13px; }
.report .tr { margin: 0; font-weight: 700; }
.report .trap { position: absolute; left: -9999px; }
.report .status { margin: 12px 0 0; color: var(--muted); }
.report .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.report button { border: 0; border-radius: 999px; padding: 9px 16px; background: var(--soft); color: var(--text); font: inherit; font-weight: 700; cursor: pointer; }
.report button.primary { background: var(--tip-bg); color: var(--tip-text); }
.report button:disabled { opacity: .5; cursor: default; }
.notice { max-width: 1260px; width: calc(100% - 40px); margin: 16px auto 0; padding: 12px 18px; border-radius: 20px; background: var(--soft); color: var(--muted); font-size: 14px; }
.more { border: 0; background: none; color: var(--muted); font-weight: 700; cursor: pointer; font-size: 14px; padding: 0 0 0 52px; }
.more:hover { color: var(--text); }

/* ---------- feed view ---------- */
.feed { max-width: 820px; margin: 0 auto; padding: 0 20px; }
.feed .day { text-align: center; font-size: 20.8px; font-weight: 700; margin: 50px 0 20px; padding-bottom: 10px; border-bottom: 1.5px solid var(--line); }
.feed .day::first-letter { text-transform: uppercase; }
.src { font-size: 13px; font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; margin-right: 6px; white-space: nowrap; }
.feed .more { margin-top: 12px; }

.empty { color: var(--muted); text-align: center; padding: 60px 0; }

/* ---------- темы дня ---------- */
/* как /sr/plot/: на компьютере тема в две колонки — слева заголовок и стороны, справа свежие новости */
.themes { max-width: 1260px; margin: 0 auto; padding: 0 20px; }
.theme { padding: 26px 0 14px; border-bottom: 1.5px solid var(--soft); }
.theme h2 { margin: 0; font-size: 22px; line-height: 1.25; font-weight: 700; color: var(--strong); display: flex; gap: 12px; }
.theme h2 a { color: inherit; text-decoration: none; }
.theme h2 a:hover { color: var(--hover); }
.theme .rank { flex: none; min-width: 22px; color: var(--faint); font-weight: 900; }
.theme-indent { margin-left: 34px; }
.theme-meta { margin: 6px 0 10px; color: var(--muted); font-size: 13px; }
.cov { margin: 4px 0 14px; color: var(--muted); font-size: 12px; line-height: 1.9; }
.cov .what { font-weight: 700; display: block; }

const ESSENCE_URL = location.hostname === "localhost" ? "http://localhost:8787/essence" : "https://vestomat-reports.vestomat.workers.dev/essence";

  const late = slot.lead?.hidden ? new Promise(done => setTimeout(done, ESSENCE_WAIT_MS, null)) : new Promise(() => {});

    fillEssence(slot, apply => reflowDetails(li, apply));
  }
  const onclick = e => {
    if (selecting(head)) { e.preventDefault(); return; }
    // Cmd/Ctrl/Shift-клик — как у обычной ссылки: статья в новой вкладке, плашка не раскрывается
    if (e.metaKey || e.ctrlKey || e.shiftKey) { opened(); return; }
    // нажатие раскрывает и сворачивает плашку (суть, подводка, кнопки), статья открывается кнопкой в ней — и на телефоне,
    // и на компьютере (подсказка при наведении мелькала, пока мышь ехала через список). Плашка раскрывается и без
    // подводки (тогда в ней только кнопки): нажатие везде делает одно и то же
    e.preventDefault();
    toggle(e);
  };

  const head = h("a", { class: "head" + (fresh ? " fresh" : ""), href: item.url, draggable: "false", target: "_blank", rel: "noopener", onclick,
    onauxclick: e => { if (e.button === 1) opened(); } },  // только колёсико: правая кнопка — это меню, а не открытие
    showSource ? h("span", { class: "src" }, h("span", { class: "dot", style: `background:var(--c-${src.section})` }), src.name) : null,
    script(v.title, v.lang),
    via ? h("span", { class: "via" }, "— " + via) : null,
    item.traffic ? h("span", { class: "traffic" }, `· ${item.traffic} ${t("searches")}`) : null,
  );

  li.append(h("div", { class: "row" },
    h("span", { class: "time", "data-time": item.date || "", title: item.date ? new Date(item.date).toLocaleString(locale()) : "" }, shortTime(item.date)),
    head,
    reportable ? h("button", { class: "report-flag", type: "button", title: t("report"), "aria-label": t("report"), onclick: () => openReport(item) }, "⚑") : null,
  ));
  if (state.open === item.url) {
    const box = details();
    li.append(box);
    showOpen(li, box);
    fillEssence(slot, apply => reflowDetails(li, apply));
  }
  return li;
}

function matches(item) {
  if (!state.q) return true;
  const text = [item.title, item.summary, item.ru?.title, item.ru?.summary].filter(Boolean).join(" ");
  return norm(text).includes(state.q);
}

// ---------- views ----------
// первый экран — поровну от каждого лагеря, а не раздел одного из них.
// Новости идут кругами: в каждом круге по одной от каждого лагеря — на телефоне это один список,
// и первый экран делят все. Кто открывает круг, меняется раз в день (по белградскому календарю).
// На широком экране те же строки расставлены колонками по лагерям: --col и --row в .camps-grid.
const CAMPS = ["independent", "state", "mainstream", "progov"];
const CAMP_ITEMS = 3;
function renderCamps() {
  const camps = [];
  for (const id of CAMPS) {
    const sec = sectionById[id];
    if (!sec || !state.sections.has(id)) continue;
    const all = DATA.sources.filter(s => s.section === id)
      .flatMap(src => src.items.filter(i => i.date).map(i => [i, src]))
      .sort((a, b) => b[0].date.localeCompare(a[0].date));
    const seen = new Set(), picked = [];
    for (const [item, src] of all) {  // от разных изданий: иначе N1 займёт весь лагерь
      if (seen.has(src.name)) continue;
      seen.add(src.name);
      picked.push([item, src]);
      if (picked.length === CAMP_ITEMS) break;
    }
    if (picked.length) camps.push({ id, sec, picked });
  }
  if (!camps.length) return [];
  const day = Math.round(Date.parse(dayKey(new Date(now))) / 864e5);
  const shift = day % camps.length;
  const order = [...camps.slice(shift), ...camps.slice(0, shift)];

  const rows = order.map(({ id, sec }, k) => h("li", { class: "camp-name", style: `--col:${k + 1};--row:1` },
    h("span", { class: "dot", style: `background:var(--c-${id})` }), label(sec, "title")));
  for (let r = 0; r < CAMP_ITEMS; r++) {
    order.forEach(({ picked }, k) => {
      if (!picked[r]) return;
      const li = renderItem(picked[r][0], picked[r][1], { showSource: true });
      li.dataset.round = r + 1;
      li.style.cssText = `--col:${k + 1};--row:${r + 2}`;
      rows.push(li);
    });
  }
  // без колонок лагерь виден только по цвету точки — подписываем цвета под заголовком
  const legend = h("p", { class: "camps-legend" }, order.map(({ id, sec }) =>
    h("span", {}, h("span", { class: "dot", style: `background:var(--c-${id})` }), label(sec, "title"))));
  return [h("div", { class: "camps", "data-id": "camps" }, h("h2", {}, t("camps")), legend, h("ul", { class: "items camps-grid" }, rows))];
}

function renderSources() {
  const out = state.q ? [] : renderCamps();
  for (const sec of DATA.sections) {
    const cards = [];
    const groupOf = new Map((sec.groups || []).flatMap(g => g.sources.map(name => [name, g])));
    const sources = DATA.sources.filter(s => s.section === sec.id);
    const done = new Set();
    for (const src of sources) {
      const group = groupOf.get(src.name);
      if (group) {
        if (!done.has(group)) cards.push(renderGroup(group, sources.filter(s => group.sources.includes(s.name)), sec));
        done.add(group);
        continue;
      }
      const items = src.items.filter(matches);
      if ((state.q || !src.error) && !items.length) continue;  // пустая лента без ошибки — Reddit ещё ждёт очереди
      const expanded = state.expandedCards.has(src.feed) || state.q;
      const shown = expanded ? items : items.slice(0, CARD_LIMIT);
      const card = h("article", { class: "card" },
        h("div", { class: "card-head" },
          h("span", { class: "avatar", style: `background:var(--c-${src.section})` }, src.name[0],
            h("img", { src: src.icon || favicon(src.site), alt: "", loading: "lazy", onerror: e => e.target.remove() })),
          h("div", {},
            h("a", { class: "card-name", href: src.site, target: "_blank", rel: "noopener" }, src.name),
            h("div", { class: "card-meta" },
              [label(src, "note"), t("lastPost")].filter(Boolean).join(" · ") + " ",
              h("span", { "data-ago": latest(src) || "" }, ago(latest(src))),
              src.error ? h("span", { class: "warn", title: src.error }, " · " + t(src.stale ? "stale" : "down")) : null,
            ),
          ),
        ),
        h("ul", { class: "items" }, shown.map(i => renderItem(i, src))),
        items.length > shown.length
          ? h("button", { class: "more", onclick: () => { state.expandedCards.add(src.feed); render(); } }, `${t("more")} ${items.length - shown.length}`)
          : null,
      );
      cards.push(card);
    }
    const shownCards = cards.filter(Boolean);
    if (!shownCards.length) continue;
    out.push(h("section", { class: "section", "data-id": sec.id },
      h("div", { class: "section-head" },
        h("h2", {}, h("span", { class: "dot", style: `background:var(--c-${sec.id})` }), label(sec, "title")),
        h("p", {}, label(sec, "note")),
      ),
      h("div", { class: "grid" }, shownCards),
    ));
  }
  return out.length ? out : [h("p", { class: "empty" }, t("nothing"))];
}

// несколько изданий одного региона — одна карточка, новости вперемешку по времени, у каждой подписано издание
// мини-карта Сербии (с Косово и Метохией) с областью группы вместо буквы; контуры — из regions.json
function regionMap(sec, group) {
  if (!sec.map || !group.map) return null;
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
  const [, , w, hgt] = sec.map.viewBox.split(" ").map(Number);
  svg.setAttribute("viewBox", `-1 -1 ${w + 2} ${hgt + 2}`);
  svg.setAttribute("class", "region-map");
  svg.setAttribute("aria-hidden", "true");
  for (const [d, cls] of [[sec.map.country, "country"], [group.map, "region"]]) {
    const path = document.createElementNS(ns, "path");
    path.setAttribute("d", d);
    path.setAttribute("class", cls);
    svg.append(path);
  }
  return svg;
}

function renderGroup(group, sources, sec) {
  const items = sources.flatMap(src => src.items.filter(matches).map(item => [item, src]))
    .sort((a, b) => (b[0].date || "").localeCompare(a[0].date || ""));
  if (!items.length) return null;
  const key = "group:" + group.title;
  const shown = state.expandedCards.has(key) || state.q ? items : items.slice(0, CARD_LIMIT);
  const last = latest({ items: items.map(([item]) => item) });
  const outlets = sources.flatMap((src, i) => [i ? " · " : "",
    h("a", { href: src.site, target: "_blank", rel: "noopener", class: src.error ? "warn" : null,
      title: [label(src, "note"), src.error ? t(src.stale ? "stale" : "down") : ""].filter(Boolean).join(" · ") }, src.name)]);
  return h("article", { class: "card" },
    h("div", { class: "card-head" },
      h("span", { class: "avatar", style: `background:var(--c-${sec.id})` }, regionMap(sec, group) || label(group, "title")[0]),
      h("div", {},
        h("span", { class: "card-name" }, label(group, "title")),
        h("div", { class: "card-meta" }, ...outlets, ` · ${t("lastPost")} `, h("span", { "data-ago": last || "" }, ago(last))),
      ),
    ),
    h("ul", { class: "items" }, shown.map(([item, src]) => renderItem(item, src, { showVia: true }))),
    items.length > shown.length
      ? h("button", { class: "more", onclick: () => { state.expandedCards.add(key); render(); } }, `${t("more")} ${items.length - shown.length}`)
      : null,
  );
}

function renderFeed() {
  const all = [];
  for (const src of DATA.sources) {
    if (!state.sections.has(src.section)) continue;
    for (const item of src.items) if (item.date && matches(item)) all.push([item, src]);
  }
  all.sort((a, b) => b[0].date.localeCompare(a[0].date));
  if (!all.length) return [h("p", { class: "empty" }, t("nothing"))];

  const wrap = h("div", { class: "feed" });
  let day = null, list = null;
  for (const [item, src] of all.slice(0, state.feedLimit)) {
    const d = new Date(item.date), key = dayKey(d);
    if (key !== day) {
      day = key;
      const label = key === dayKey(new Date(now)) ? t("today") : key === dayKey(new Date(now - 864e5)) ? t("yesterday") : longDayFmt.format(d);
      list = h("ul", { class: "items" });
      wrap.append(h("div", { class: "day" }, label), list);
    }
    list.append(renderItem(item, src, { showSource: true }));
  }
  if (all.length > state.feedLimit) {
    wrap.append(h("button", { class: "more", onclick: () => { state.feedLimit += FEED_PAGE; render(); } },
      `${t("showMore")} (${all.length - state.feedLimit})`));
  }
  return [wrap];
}

// ---------- темы дня ----------
// сюжеты — из /themes.json (пишет stories_live.py вместе со страницами /sr/plot/ и /ru/plot/): те же сюжеты, порядок и
// новости. Грузим только когда открыли вид. Новость, которая ещё есть в DATA, рисуется как везде (перевод, подводка,
// прочитанное); старше ленты — из themes.json, с теми же полями
let THEMES = null, themesLoading = false;
function loadThemes() {
  if (THEMES || themesLoading) return;
  themesLoading = true;
  fetch(`/themes.json?v=${Date.parse(DATA.generated)}`).then(r => r.json())
    .catch(() => ({ stories: [] }))
    .then(d => { THEMES = d; if (state.view === "themes") render(); });
}
// стороны — только писали или нет, без чисел; порядок спектра — один для всех тем; пары не разрываются при переносе
const SPECTRUM = ["independent", "mainstream", "state", "progov"];
function renderThemes() {
  if (!THEMES) { loadThemes(); return [h("p", { class: "empty" }, t("loading"))]; }
  const byUrl = new Map(DATA.sources.flatMap(src => src.items.map(i => [i.url, [i, src]])));
  const srcByName = new Map(DATA.sources.map(s => [s.name, s]));
  const base = ru() ? "/ru/plot/" : "/sr/plot/";
  const name = id => sectionById[id] ? label(sectionById[id], "title") : id;
  const newsWord = n => ru() ? plural(n, "новость", "новости", "новостей") : tx(plural(n, "vest", "vesti", "vesti"));
  const stories = THEMES.stories.filter(s => !state.q || norm([s.title.sr, s.title.ru, ...s.items.flatMap(i => [i.sr, i.ru])].join(" ")).includes(state.q));
  if (!stories.length) return [h("p", { class: "empty" }, t(state.q ? "nothing" : "noThemes"))];
  const wrap = h("div", { class: "themes" });
  stories.forEach((s, k) => {
    const title = ru() ? s.title.ru : tx(s.title.sr);
    const sides = SPECTRUM.filter(id => sectionById[id]).map(id => s.wrote.includes(id)
      ? h("span", {}, h("span", { class: "dot", style: `background:var(--c-${id})` }), name(id))
      : h("span", { class: "none" }, h("span", { class: "dot", style: `background:var(--c-${id})` }), `${name(id)}: ${t("silent")}`));
    const pairs = [];
    for (let i = 0; i < sides.length; i += 2) pairs.push(h("span", { class: "pair" }, ...sides.slice(i, i + 2)));
    const list = h("ul", { class: "items" }, ...s.items.map(x => {
      const hit = byUrl.get(x.url);
      if (hit) return renderItem(hit[0], hit[1], { showSource: true });
      const src = srcByName.get(x.source) || { name: x.source, section: x.section, lang: "sr" };
      return renderItem({ url: x.url, title: x.sr, date: x.date, ru: { title: x.ru } }, src, { showSource: true });
    }));
    const link = `${base}${s.id}/`;
    wrap.append(h("article", { class: "theme" },
      h("div", { class: "theme-lhs" },
        h("h2", {}, h("span", { class: "rank" }, String(k + 1)),
          h("a", { href: link, target: "_blank", onclick: () => track("theme") }, title)),
        h("div", { class: "theme-indent" },
          h("p", { class: "theme-meta" }, `${s.news} ${newsWord(s.news)} · ${outletCount(s.outlets)} · ${t("since")} ${dayMonth(s.created)}`),
          h("p", { class: "cov" }, h("span", { class: "what" }, t("wrote")), h("span", { class: "sides" }, ...pairs),
            s.others.length ? h("span", { class: "rest" }, `${t("otherMedia")} ${s.others.map(name).join(" · ")}`) : null))),
      h("div", { class: "theme-rhs theme-indent" }, list,
        h("a", { class: "all", href: link, target: "_blank" },
          s.news > s.items.length ? `${t("allNews")} ${s.news} ${newsWord(s.news)} →` : `${t("themePage")} →`))));
  });
  return [wrap];
}
function dayMonth(iso) {
  const d = new Date(iso);
  return `${d.getDate()}.${d.getMonth() + 1}.`;
}

function renderChips() {
  const chips = document.getElementById("chips");
  chips.replaceChildren();
  if (state.view === "feed") renderFilterChips(chips);
  else if (state.view !== "themes") renderContents(chips);
  chips.hidden = !chips.children.length;
  measureSticky();
  spy();
}

// оглавление: только разделы, которые сейчас на странице (поиск мог часть скрыть)
const JUMP_TARGETS = "#main .camps, #main .section";
function renderContents(chips) {
  for (const el of document.querySelectorAll(JUMP_TARGETS)) {
    if (el.dataset.id === "camps") {  // блок «поровну от каждого лагеря» — точка из цветов всех лагерей
      chips.append(h("button", { class: "chip jump", "data-id": "camps", onclick: () => el.scrollIntoView({ behavior: "smooth" }) },
        h("span", { class: "dot camps-dot" }), t("campsChip")));
      continue;
    }
    const sec = sectionById[el.dataset.id];
    chips.append(h("button", { class: "chip jump", "data-id": sec.id, title: label(sec, "note"), onclick: () => el.scrollIntoView({ behavior: "smooth" }) },
      h("span", { class: "dot", style: `background:var(--c-${sec.id})` }), label(sec, "title")));
  }
}

// подсвечиваем в оглавлении раздел, который сейчас читают
let stickyHeight = 0;
function spy() {
  const sections = [...document.querySelectorAll(JUMP_TARGETS)];
  if (state.view === "feed" || !sections.length) return;
  const atBottom = innerHeight + scrollY >= document.documentElement.scrollHeight - 2;
  let current = atBottom ? sections.at(-1) : sections[0];
  if (!atBottom) for (const el of sections) if (el.getBoundingClientRect().top <= stickyHeight + 40) current = el;
  const chips = document.getElementById("chips");
  for (const b of chips.querySelectorAll(".jump")) {
    const on = b.dataset.id === current?.dataset.id;
    if (on === (b.getAttribute("aria-current") === "true")) continue;
    b.setAttribute("aria-current", String(on));
    if (on) chips.scrollTo({ left: b.offsetLeft - 16, behavior: "smooth" });  // на телефоне ряд прокручивается вбок
  }
}

function measureSticky() {
  const header = document.querySelector("header"), chips = document.getElementById("chips");
  // высота дробная (68.6px), а offsetHeight округляет вверх — между шапкой и разделами оставалась щель,
  // сквозь которую мелькала лента. Округляем вниз: ряд разделов чуть заходит под шапку
  const headerH = getComputedStyle(header).position === "sticky" ? Math.floor(header.getBoundingClientRect().height) : 0;
  // на телефоне ряд разделов не липнет — тогда и отступ под него не нужен
  const chipsH = chips.hidden || getComputedStyle(chips).position !== "sticky" ? 0 : chips.offsetHeight;
  // шапка липнет не к самому верху, а под строку состояния приложения (top: var(--safe-top))
  stickyHeight = (headerH && parseFloat(getComputedStyle(header).top)) + headerH + chipsH;
  document.documentElement.style.setProperty("--header-h", headerH + "px");
  document.documentElement.style.setProperty("--sticky-h", stickyHeight + "px");
}
let spyFrame;
const toTop = document.getElementById("to-top");
toTop.addEventListener("click", () => scrollTo({ top: 0, behavior: "smooth" }));
function onScroll() {
  spy();
  // кнопка нужна, только когда ряд разделов уехал вверх и не липнет (на компьютере он всегда на экране)
  const chips = document.getElementById("chips");
  toTop.hidden = getComputedStyle(chips).position === "sticky" || chips.getBoundingClientRect().bottom > 0;
}
addEventListener("scroll", () => { cancelAnimationFrame(spyFrame); spyFrame = requestAnimationFrame(onScroll); }, { passive: true });
addEventListener("resize", () => { measureSticky(); spy(); });

// фильтр общей ленты: «Все» или выбранные разделы. Первый клик по разделу оставляет только его,
// следующие добавляют или убирают разделы — не надо выключать лишнее по одному
function renderFilterChips(chips) {
  const ids = DATA.sections.map(s => s.id);
  const all = ids.every(id => state.sections.has(id));
  const apply = sections => {
    state.sections = sections.size ? sections : new Set(ids);
    state.feedLimit = FEED_PAGE;
    render();
  };
  chips.append(h("button", { class: "chip", "aria-pressed": String(all), onclick: () => apply(new Set(ids)) }, t("all")));
  for (const sec of DATA.sections) {
    const on = !all && state.sections.has(sec.id);
    chips.append(h("button", {
      class: "chip", "aria-pressed": String(on), title: label(sec, "note"),
      onclick: () => {
        if (all) return apply(new Set([sec.id]));
        const next = new Set(state.sections);
        on ? next.delete(sec.id) : next.add(sec.id);
        apply(next);
      },
    }, h("span", { class: "dot", style: `background:var(--c-${sec.id})` }), label(sec, "title")));
  }
}

// ---------- шапка: курс, погода, воздух (собираются при сборке, см. header_info в build.py) ----------
// европейский индекс качества воздуха: границы классов и цвета Европейского агентства по окружающей среде
const AQI_LEVELS = [[20, "#50f0e6"], [40, "#50ccaa"], [60, "#f0e641"], [80, "#ff5050"], [100, "#960032"], [Infinity, "#7d2181"]];
function weatherIcon(code, day) {
  if (code <= 1) return day ? "☀️" : "🌙";
  if (code === 2) return day ? "⛅" : "☁️";
  if (code === 3) return "☁️";
  if (code === 45 || code === 48) return "🌫️";
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "🌨️";
  if (code >= 95) return "⛈️";
  return "🌧️";
}
function renderInfo() {
  const info = DATA.info || {};
  const num = v => new Intl.NumberFormat(locale(), { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v);
  const parts = [];
  if (info.rates) {
    const hint = `${t("rateHint")} ${dayFmt.format(new Date(info.rates.date))}`;
    parts.push(h("span", { title: hint }, `€ ${num(info.rates.EUR)}`, h("span", { class: "unit" }, ` ${t("din")}`)));
    parts.push(h("span", { title: hint }, `₽ ${num(info.rates.RUB)}`, h("span", { class: "unit" }, ` ${t("din")}`)));
  }
  if (info.weather) {
    const temp = Math.round(info.weather.temp);
    parts.push(h("span", {}, `${t("city")} ${temp > 0 ? "+" : ""}${temp}° ${weatherIcon(info.weather.code, info.weather.day)}`));
  }
  if (info.air) {
    const level = AQI_LEVELS.findIndex(([max]) => info.air.aqi < max);
    parts.push(h("span", { title: `${t("airHint")}: ${Math.round(info.air.aqi)}, PM2.5 ${Math.round(info.air.pm25)} µg/m³` },
      `${t("air")}: ${t("aqi" + level)}`, h("span", { class: "dot", style: `background:${AQI_LEVELS[level][1]}` })));
  }
  document.getElementById("info").replaceChildren(...parts.flatMap((p, i) => i ? [" · ", p] : [p]));
}

function render() {
  for (const [id, key] of [["lang", "lang"], ["view", "view"], ["script", "script"]]) {
    for (const b of document.querySelectorAll(`#${id} button`)) b.setAttribute("aria-pressed", String(b.dataset.v === state[key]));
  }
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
  document.documentElement.lang = ru() ? "ru" : state.script === "cyr" ? "sr-Cyrl" : "sr-Latn";
  // по-русски алфавит не нужен, но место его остаётся: кнопки языка и вида стоят там же, где по-сербски
  const scriptSeg = document.getElementById("script");
  scriptSeg.style.visibility = ru() ? "hidden" : "";
  scriptSeg.ariaHidden = ru() ? "true" : null;
  const notice = document.getElementById("notice");
  // в русском режиме всегда объясняем, что переведено и кем; если перевода не хватает — говорим и об этом
  notice.hidden = !ru();
  notice.textContent = TRANSLATION_GAP === "none" ? t("noTranslations")
    : TRANSLATION_GAP ? `${t("aiNote")} ${t("partial")}` : t("aiNote");
  document.title = t("pageTitle");
  // адрес следует за языком: ссылка, которой делятся, открывается на том же языке
  const path = ru() ? "/ru/" : "/";
  if (location.pathname !== path) history.replaceState(null, "", path + location.search + location.hash);
  document.getElementById("script").title = t("scriptHint");
  document.getElementById("q").placeholder = t("search");
  document.getElementById("q-clear").title = document.getElementById("q-clear").ariaLabel = t("clear");
  document.getElementById("to-top").title = document.getElementById("to-top").ariaLabel = t("toTop");
  renderUpdated();
  renderInfo();
  document.querySelector("footer").classList.toggle("narrow", state.view === "feed");
  resetDetails();
  document.getElementById("main").replaceChildren(...(state.view === "feed" ? renderFeed()
    : state.view === "themes" ? renderThemes() : renderSources()));
  renderChips();
}

// ---------- свежая сборка ----------
// сборка выходит раз в 15 минут, а открытая страница сама не меняется: проверяем крошечный version.json
// и предлагаем обновиться — перерисовывать новости под читателем не стоит, он может быть посреди ленты
let newer = false;
const refreshBtn = document.getElementById("refresh");
// Просто location.reload() мало: перезагрузку перехватывает service worker и при медленной сети отдаёт свою
// старую копию — кнопка «обновить» тогда ничего не меняла. Поэтому сначала сами скачиваем свежую страницу
// мимо service worker'а (он перехватывает только переходы, не fetch) и кладём её в его кеш — так что
// после перезагрузки свежая окажется и в сети, и в кеше. Имя кеша — PAGES из /sw.js.
let reloading = false;
async function reloadFresh() {
  if (reloading) return;
  reloading = true;
  refreshBtn.textContent = `↻ ${t("loading")}`;
  try {
    if (navigator.serviceWorker?.controller && self.caches) {
      const path = location.pathname;
      const r = await fetch(path, { cache: "no-store" });
      if (r.ok) await (await caches.open("pages-v2")).put(path, r);
    }
  } catch {}
  location.reload();
}
refreshBtn.addEventListener("click", reloadFresh);
// «72 издания», а не «72 изданий»
const outletCount = n => `${n} ${ru() ? plural(n, "издание", "издания", "изданий") : tx(plural(n, "medij", "medija", "medija"))}`;
function renderUpdated() {
  document.getElementById("updated").replaceChildren(
    h("b", {}, "Vestomat"), " · ",
    `${t("updated")} ${updatedAt()} · ${outletCount(DATA.sources.length)}`,
    newer ? " · " : "", newer ? h("button", { class: "refresh-link", type: "button", onclick: reloadFresh }, t("reload")) : "");
  refreshBtn.textContent = `↻ ${t("freshNews")} · ${t("reload")}`;
}
// сборка не сегодняшняя — пишем и дату: «обновлено 02:31» на странице четырёхдневной давности выглядит свежей
function updatedAt() {
  const d = new Date(DATA.generated);
  return dayKey(d) === dayKey(new Date()) ? timeFmt.format(d)
    : fmt({ day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }).format(d);
}
// Приложение с экрана «Домой» (особенно Firefox на Android) не открывает страницу заново, а возвращает
// ту же вкладку, что была днями раньше. Если страница старше часа и читатель её сейчас не читает — только что
// открыл или вернулся после долгого перерыва, — обновляемся сами, без кнопки. Одна попытка на сборку:
// если service worker снова отдал старую копию (плохая сеть), остаётся кнопка, а не цикл перезагрузок.
const openedAt = Date.now();
let hiddenAt = document.hidden ? Date.now() : 0;
const idleReturn = () => Date.now() - openedAt < 15e3 && scrollY < 200;
let returned = false;
async function checkVersion() {
  if (newer || document.hidden) return;
  let latest;
  try {
    const r = await fetch(`/version.json?t=${Date.now()}`, { cache: "no-store" });
    latest = (await r.json()).generated;
    if (new Date(latest) <= new Date(DATA.generated)) return;
  } catch {
    return;
  }
  if ((returned || idleReturn()) && Date.now() - new Date(DATA.generated) > 3600e3
      && sessionStorage.getItem("autoReload") !== latest) {
    sessionStorage.setItem("autoReload", latest);
    reloadFresh();
    return;
  }
  newer = true;
  refreshBtn.hidden = false;
  renderUpdated();
}
setInterval(checkVersion, 5 * 60e3);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  returned = hiddenAt > 0 && Date.now() - hiddenAt > 30 * 60e3;
  hiddenAt = 0;
  renderUpdated();
  checkVersion().finally(() => { returned = false; });
});
// вкладку вернули из bfcache или снова появилась сеть — тоже проверяем
addEventListener("pageshow", e => { if (e.persisted) { returned = true; checkVersion().finally(() => { returned = false; }); } });
addEventListener("online", checkVersion);
// без service worker'а Firefox тоже может показать старую страницу из своего кеша — проверяем всегда
checkVersion();
// «12 мин» и «последний пост 2 ч назад» иначе так и застынут с момента открытия
setInterval(() => {
  now = Date.now();
  for (const el of document.querySelectorAll("[data-time]")) el.textContent = shortTime(el.dataset.time);
  for (const el of document.querySelectorAll("[data-ago]")) el.textContent = ago(el.dataset.ago);
}, 60e3);

// ---------- статистика ----------
// GoatCounter: без cookies, считает просмотры страницы сам. Здесь — события: что кликают и как читают.
// Скрипт грузится асинхронно и может быть заблокирован — тогда события просто теряются
function track(path, title) {
  window.goatcounter?.count?.({ path, title, event: true });
}
// какие новости раскрывают и по каким уходят читать: путь — сама статья (сайт и адрес без https://), название — заголовок
// (по-русски, если есть перевод): в GoatCounter у каждой новости своя строка, видно и сколько, и что именно
const newsPath = (kind, item) => `${kind}/${item.url.replace(/^https?:\/\/(www\.)?/, "").replace(/[?#].*$/, "")}`;
const trackNews = (kind, item) => track(newsPath(kind, item), item.ru?.title || item.title);
// на каком языке и алфавите открывают сайт (с учётом сохранённого выбора) — один раз за визит
addEventListener("load", () => track(`visit/${ru() ? "ru" : state.script}`));
// не считать свой браузер: то же, что /#toggle-goatcounter, но и там, где адресной строки нет (приложение с экрана
// «Домой» — у него на iOS свой localStorage). Пять быстрых нажатий на «Анонимная статистика…» в подвале
{
  let taps = 0, tapTimer;
  document.querySelector('footer [data-t="stats"]').addEventListener("click", () => {
    clearTimeout(tapTimer); tapTimer = setTimeout(() => taps = 0, 1500);
    if (++taps < 5) return;
    taps = 0;
    const off = localStorage.getItem("skipgc") === "t";
    if (off) localStorage.removeItem("skipgc"); else localStorage.setItem("skipgc", "t");
    alert(off ? "GoatCounter: этот браузер снова считается" : "GoatCounter: этот браузер больше не считается");
  });
}
// сколько читателей открывают сайт как приложение с экрана «Домой»
if (matchMedia("(display-mode: standalone)").matches || navigator.standalone) addEventListener("load", () => track("visit/app"));

// ---------- приложение ----------
// /sw.js держит страницу в кеше: с экрана «Домой» она открывается сразу и без сети
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));

// ---------- wiring ----------
for (const [id, key] of [["lang", "lang"], ["view", "view"], ["script", "script"]]) {
  document.getElementById(id).addEventListener("click", e => {
    const v = e.target.closest("button")?.dataset.v;
    if (!v) return;
    if (v !== state[key]) track(`${key}/${v}`);
    // другой вид — фильтр разделов снимается
    if (key === "view" && v !== state.view) { state.sections = new Set(DATA.sections.map(s => s.id)); state.feedLimit = FEED_PAGE; }
    state[key] = v; store.set(key, v); render();
  });
}
let qTimer;
const qInput = document.getElementById("q"), qClear = document.getElementById("q-clear");
function search(delay) {
  qClear.hidden = !qInput.value;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.q = norm(qInput.value.trim()); state.feedLimit = FEED_PAGE; render(); }, delay);
}
qInput.addEventListener("input", () => search(150));
qInput.addEventListener("input", () => track("search"), { once: true });  // сам запрос не отправляем
qClear.addEventListener("click", () => { qInput.value = ""; search(0); qInput.focus(); });
// Esc тоже очищает поиск
qInput.addEventListener("keydown", e => { if (e.key === "Escape" && qInput.value) { qInput.value = ""; search(0); } });
// браузер может вернуть текст в поле при обновлении страницы без события input — тогда крестик скрыт, а фильтр
// не работает. autocomplete="off" это отключает; если текст всё же вернулся, применяем его как запрос
if (qInput.value) search(0);

// сколько новостей осталось без перевода (например, сборка шла без ключа)
const TRANSLATION_GAP = (() => {
  const items = DATA.sources.flatMap(s => s.items.filter(i => (i.lang || s.lang) !== "ru"));
  const done = items.filter(i => i.ru).length;
  return done === 0 ? "none" : done < items.length * 0.9 ? "partial" : null;
})();

render();
</script>

        integrity="sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRVQ" crossorigin="anonymous"></script>
